<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Car lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0e10; overflow: hidden; font: 12px Consolas, monospace; color: #ccc; }
  #wrap { position: relative; margin: 0 auto; }
  #wrap canvas, #wrap img { position: absolute; inset: 0; width: 100%; height: 100%; }
  #wrap img { opacity: var(--o, 0.5); pointer-events: none; }
  #hud { position: fixed; left: 8px; bottom: 8px; background: #000a; padding: 4px 8px; }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js", "three/addons/": "../vendor/addons/" } }</script>
</head><body>
<div id="wrap"><canvas id="c"></canvas><img id="ref" alt=""></div>
<div id="hud"></div>
<script type="module">
// Dev-only replica check: renders the car with a camera calibrated to a reference photo and overlays it.
// ?ref=side|top|rear|free  &o=0..1 overlay opacity  &doors=1  &wing=1  &covers=1
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildCar } from '../src/car.js';
import { CG } from '../src/params.js';
const q = new URLSearchParams(location.search), mode = q.get('ref') || 'side';
// Photo calibration: pixel = origin + metres * scale (design frame: z behind front axle, y above road).
const REFS = {
  side: { img: '../refs/01-tesla-roadster-starman.jpg', w: 1980, h: 1030, ax: 730, ay: 814, s: 276.5, view: 'side' },
  top: { img: '../refs/03-Roadster_92.jpg', w: 2400, h: 1598, ax: 940, ay: 795, s: 177.4, view: 'top' },
  rear: { img: '../refs/25-Roadster_91.jpg', w: 2400, h: 1600, ax: 1202, ay: 1293, s: 666, view: 'rear' },
  front: { img: '../Screenshot 2026-10-18 020112.png', w: 509, h: 351, ax: 254, ay: 300, s: 205, view: 'front' },
};
const R = REFS[mode] || REFS.side;
const wrap = document.getElementById('wrap'), img = document.getElementById('ref');
const fit = Math.min(innerWidth / R.w, innerHeight / R.h);
wrap.style.width = R.w * fit + 'px'; wrap.style.height = R.h * fit + 'px';
img.src = R.img; wrap.style.setProperty('--o', q.get('o') ?? 0.5);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(R.w * fit, R.h * fit, false);
renderer.toneMapping = THREE.AgXToneMapping;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(-3, 6, 2); scene.add(sun);
const car = buildCar(); scene.add(car.group);
if (q.get('doors')) car.setDoors(true);
if (q.get('covers')) car.setCovers(true);
const fake = { wheels: [], thrust: new Array(10).fill(0), wing: { deploy: q.get('wing') ? 1 : 0, aoa: 0 }, speed: 0, input: { brake: 0, throttle: 0 }, fanLevel: 0, steerAngle: 0, holding: false };
import('../src/params.js').then(({ WHEELS, SUSP_REST }) => { fake.wheels = WHEELS.map((w) => ({ ...w, comp: 0.057, spin: 0, steer: 0 })); });
// Orthographic camera whose frustum reproduces the photo's pixel mapping.
const zOf = (px) => (px - R.ax) / R.s - CG.fromFrontAxle, yOf = (py) => (R.ay - py) / R.s - CG.height, xOf = (px) => (px - R.ax) / R.s;
let cam;
if (R.view === 'side') { cam = new THREE.OrthographicCamera(zOf(0), zOf(R.w), yOf(0), yOf(R.h), 0.1, 100); cam.position.set(-20, 0, 0); cam.up.set(0, 1, 0); cam.lookAt(0, 0, 0); }
if (R.view === 'top') { cam = new THREE.OrthographicCamera(zOf(0), zOf(R.w), -(0 - R.ay) / R.s, -(R.h - R.ay) / R.s, 0.1, 100); cam.position.set(0, 20, 0); cam.up.set(-1, 0, 0); cam.lookAt(0, 0, 0); }
if (R.view === 'rear' || R.view === 'front') { cam = new THREE.OrthographicCamera(xOf(0), xOf(R.w), yOf(0), yOf(R.h), 0.1, 100); const d = R.view === 'rear' ? 20 : -20; cam.position.set(0, 0, d); cam.lookAt(0, 0, 0); if (R.view === 'front') { cam.left = -xOf(0); cam.right = -xOf(R.w); } cam.updateProjectionMatrix(); }
if (mode === 'free') { img.style.display = 'none'; cam = new THREE.PerspectiveCamera(30, R.w / R.h, 0.1, 100); cam.position.set(-5, 2, -6); new OrbitControls(cam, renderer.domElement); }
let last = performance.now();
(function loop(now) { requestAnimationFrame(loop); const dt = Math.min(0.05, (now - last) / 1000); last = now; if (fake.wheels.length) car.update(fake, dt); renderer.render(scene, cam); })(last);
document.getElementById('hud').textContent = `ref=${mode}  (side | top | rear | front | free)  o=${q.get('o') ?? 0.5}`;
window.carlab = { car, scene, cam, renderer, fake };
</script></body></html>
